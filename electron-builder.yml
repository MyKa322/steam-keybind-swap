appId: com.keybindswap.app
productName: Keybind Swap
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  # Имя без версии намеренно: по адресу
  # releases/latest/download/KeybindSwap-Setup.exe скачивание начинается сразу
  # и ссылка не ломается при выпуске новой версии. Версия видна в названии
  # релиза и в самом приложении.
  artifactName: KeybindSwap-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Keybind Swap
